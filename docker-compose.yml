services:
  postgres:
    image: postgres:16-alpine
    container_name: smartschool-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartschool
    ports:
      - "5432:5432"
    volumes:
      - smartschool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartschool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartschool-redis
    ports:
      - "6379:6379"
    volumes:
      - smartschool_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smartschool_pgdata:
  smartschool_redisdata:
